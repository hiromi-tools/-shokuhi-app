<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>食費予算チェッカー</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食費予算チェッカー">
<meta name="theme-color" content="#c9a0a8">
<style>
  :root {
    --bg: #fdf3fa;
    --card: #ffffff;
    --text: #4b3f5e;
    --sub: #a899b8;
    --green: #ff9fc2;
    --green-dark: #4fbe95;
    --orange: #ffc98b;
    --red: #ff6b81;
    --border: #f3e6f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    padding-bottom: 40px;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: 20px 16px 16px;
    text-align: center;
    position: relative;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
  }
  header p {
    margin: 4px 0 0;
    font-size: 14px;
    opacity: 0.9;
  }
  .settings-btn {
    position: absolute;
    top: 16px;
    right: 14px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    font-size: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    line-height: 1;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .summary-item {
    text-align: center;
    padding: 12px 6px;
    border-radius: 12px;
    background: #ffeef5;
  }
  .summary-item .label {
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 4px;
  }
  .summary-item .value {
    font-size: 20px;
    font-weight: 700;
  }
  .summary-item.remaining .value { color: var(--green-dark); }
  .summary-item.over .value { color: var(--red); }
  .progress-bar-bg {
    background: #f5e9f7;
    border-radius: 10px;
    height: 18px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--green);
    transition: width 0.3s;
  }
  .progress-bar-fill.warn { background: var(--orange); }
  .progress-bar-fill.over { background: var(--red); }
  .progress-label {
    text-align: right;
    font-size: 14px;
    color: var(--sub);
    font-weight: 600;
  }
  .box-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .daily-box {
    text-align: center;
    padding: 16px 8px;
    border-radius: 12px;
    background: #e9fbf3;
    border: 1px solid #c9f3de;
  }
  .daily-box .label {
    font-size: 13px;
    color: var(--sub);
  }
  .daily-box .value {
    font-size: 22px;
    font-weight: 800;
    color: var(--green-dark);
    margin-top: 4px;
  }
  .daily-box.over-budget {
    background: #ffe7eb;
    border-color: #ffc9d3;
  }
  .daily-box.over-budget .value { color: var(--red); font-size: 16px; }

  h2 {
    font-size: 17px;
    margin: 0 0 12px;
  }
  label {
    display: block;
    font-size: 14px;
    color: var(--sub);
    margin: 12px 0 6px;
    font-weight: 600;
  }
  input, select {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fbfcfc;
    color: var(--text);
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a899b8'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 20px;
    padding-right: 40px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--green);
  }
  button.submit-btn {
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 12px;
  }
  button.submit-btn:active { background: var(--green-dark); }

  .entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
  }
  .entry:last-child { border-bottom: none; }
  .entry-info { flex: 1; min-width: 0; }
  .entry-date {
    font-size: 13px;
    color: var(--sub);
  }
  .entry-store {
    font-size: 16px;
    font-weight: 600;
    margin-top: 2px;
  }
  .entry-cat {
    display: inline-block;
    font-size: 12px;
    color: var(--green-dark);
    background: #e9fbf3;
    border-radius: 6px;
    padding: 1px 7px;
    margin-top: 4px;
  }
  .entry-amount {
    font-size: 17px;
    font-weight: 700;
    margin-right: 10px;
    white-space: nowrap;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--red);
    font-size: 22px;
    padding: 6px 10px;
    line-height: 1;
  }
  .empty {
    text-align: center;
    color: var(--sub);
    padding: 20px 0;
    font-size: 14px;
  }
  .status-msg {
    text-align: center;
    font-size: 13px;
    color: var(--sub);
    margin-top: 8px;
    min-height: 18px;
  }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 2px;
    border-bottom: 1px solid var(--border);
  }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-name {
    font-size: 15px;
    font-weight: 600;
  }
  .breakdown-bar-bg {
    flex: 1;
    height: 8px;
    background: #e3e8e6;
    border-radius: 4px;
    margin: 0 10px;
    overflow: hidden;
  }
  .breakdown-bar-fill {
    height: 100%;
    background: var(--green);
  }
  .breakdown-amount {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
  }

  .settings-panel {
    display: none;
  }
  .settings-panel.open {
    display: block;
  }
  .settings-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .settings-row input { flex: 1; }
  .settings-row button {
    padding: 14px 18px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 10px;
    white-space: nowrap;
  }
  .close-settings {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 12px;
    background: none;
    border: none;
    color: var(--sub);
    font-size: 14px;
    padding: 8px;
  }
</style>
</head>
<body>

<header>
  <button class="settings-btn" id="settingsBtn" aria-label="予算を設定">⚙️</button>
  <h1>🍚 食費予算チェッカー</h1>
  <p id="monthLabel">読み込み中...</p>
</header>

<div class="wrap">

  <div class="card settings-panel" id="settingsPanel">
    <h2>月の食費予算を設定</h2>
    <label for="budgetInput">月の予算（円）</label>
    <div class="settings-row">
      <input type="number" id="budgetInput" inputmode="numeric" min="0">
      <button id="saveBudgetBtn">保存</button>
    </div>
    <button class="close-settings" id="closeSettingsBtn">閉じる</button>
  </div>

  <div class="card">
    <div class="summary-grid">
      <div class="summary-item">
        <div class="label">今月使った金額</div>
        <div class="value" id="usedValue">¥0</div>
      </div>
      <div class="summary-item remaining" id="remainingBox">
        <div class="label">今月残っている金額</div>
        <div class="value" id="remainingValue">¥0</div>
      </div>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progressLabel">予算の 0% を使用</div>

    <div class="box-grid">
      <div class="daily-box" id="dailyBox">
        <div class="label">残り<span id="daysLeftLabel">-</span>日<br>1日あたりあと使える</div>
        <div class="value" id="dailyValue">¥0</div>
      </div>
      <div class="daily-box" id="weeklyBox">
        <div class="label">今週あと使える<br>（残り<span id="weekDaysLeftLabel">-</span>日分）</div>
        <div class="value" id="weeklyValue">¥0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>買い物を記録する</h2>
    <label for="dateInput">日付</label>
    <input type="date" id="dateInput">

    <label for="storeInput">店</label>
    <select id="storeInput">
      <option value="ロピア">ロピア</option>
      <option value="あおば">あおば</option>
      <option value="オーケー">オーケー</option>
      <option value="セレサモス">セレサモス</option>
      <option value="その他">その他</option>
    </select>
    <input type="text" id="storeOtherInput" placeholder="店名を入力" style="margin-top:8px; display:none;">

    <label for="categoryInput">カテゴリ</label>
    <select id="categoryInput">
      <option value="肉・魚">肉・魚</option>
      <option value="野菜">野菜</option>
      <option value="豆類">豆類</option>
      <option value="米">米</option>
      <option value="酒">酒</option>
      <option value="乳製品">乳製品</option>
      <option value="調味料">調味料</option>
      <option value="その他">その他</option>
    </select>

    <label for="amountInput">金額（円）</label>
    <input type="number" id="amountInput" placeholder="例：1580" inputmode="numeric" min="0">

    <button class="submit-btn" id="addBtn">追加する</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="card">
    <h2>店別の今月合計</h2>
    <div id="storeBreakdown">
      <div class="empty">まだ記録がありません</div>
    </div>
  </div>

  <div class="card">
    <h2>カテゴリ別の今月合計</h2>
    <div id="categoryBreakdown">
      <div class="empty">まだ記録がありません</div>
    </div>
  </div>

  <div class="card">
    <h2>今月の記録</h2>
    <div id="entryList">
      <div class="empty">まだ記録がありません</div>
    </div>
  </div>

</div>

<script>
const DEFAULT_BUDGET = 84400;
const ENTRIES_KEY = 'food_budget_entries';
const SETTINGS_KEY = 'food_budget_settings';

let entries = [];
let budget = DEFAULT_BUDGET;

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function currentMonthKey() {
  return todayStr().slice(0,7); // YYYY-MM
}

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function formatYen(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
}

async function loadEntries() {
  try {
    const raw = localStorage.getItem(ENTRIES_KEY);
    entries = raw ? JSON.parse(raw) : [];
  } catch (e) {
    entries = [];
  }
}

async function saveEntries() {
  try {
    localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries));
  } catch (e) {
    document.getElementById('statusMsg').textContent = '保存に失敗しました。もう一度お試しください。';
  }
}

async function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.budget && parsed.budget > 0) budget = parsed.budget;
    }
  } catch (e) {
    budget = DEFAULT_BUDGET;
  }
}

async function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({ budget }));
  } catch (e) {
    // ignore
  }
}

function render() {
  const monthKey = currentMonthKey();
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const dayOfMonth = now.getDate();
  const totalDays = daysInMonth(year, month);
  const daysLeft = totalDays - dayOfMonth + 1; // 今日を含む残り日数（月末まで）

  // 週の残り日数（月曜始まり、今日を含む。月末で切れる場合はそちらを優先）
  const dow = now.getDay(); // 0=日,1=月,...6=土
  const mondayIndex = (dow + 6) % 7; // 0=月,...6=日
  const daysLeftInWeekRaw = 7 - mondayIndex; // 今日を含め日曜まで
  const weekDaysLeft = Math.min(daysLeftInWeekRaw, daysLeft);

  document.getElementById('monthLabel').textContent = `${year}年${month}月の食費（予算 ${formatYen(budget)}）`;
  document.getElementById('budgetInput').value = budget;

  const monthEntries = entries
    .filter(e => e.date.slice(0,7) === monthKey)
    .sort((a,b) => b.date.localeCompare(a.date) || (b.id - a.id));

  const used = monthEntries.reduce((sum, e) => sum + e.amount, 0);
  const remaining = budget - used;
  const percent = budget > 0 ? (used / budget) * 100 : 0;

  document.getElementById('usedValue').textContent = formatYen(used);
  document.getElementById('remainingValue').textContent = formatYen(remaining);

  const remainingBox = document.getElementById('remainingBox');
  remainingBox.classList.toggle('over', remaining < 0);

  const fill = document.getElementById('progressFill');
  const pct = Math.min(percent, 100);
  fill.style.width = pct + '%';
  fill.classList.remove('warn','over');
  if (percent >= 100) fill.classList.add('over');
  else if (percent >= 80) fill.classList.add('warn');

  document.getElementById('progressLabel').textContent =
    `予算の ${percent.toFixed(1)}% を使用`;

  document.getElementById('daysLeftLabel').textContent = daysLeft;
  document.getElementById('weekDaysLeftLabel').textContent = weekDaysLeft;

  const dailyBox = document.getElementById('dailyBox');
  const dailyValueEl = document.getElementById('dailyValue');
  const weeklyBox = document.getElementById('weeklyBox');
  const weeklyValueEl = document.getElementById('weeklyValue');

  if (remaining <= 0) {
    dailyBox.classList.add('over-budget');
    dailyValueEl.textContent = '予算オーバー';
    weeklyBox.classList.add('over-budget');
    weeklyValueEl.textContent = '予算オーバー';
  } else {
    dailyBox.classList.remove('over-budget');
    weeklyBox.classList.remove('over-budget');
    const perDay = remaining / Math.max(daysLeft, 1);
    dailyValueEl.textContent = formatYen(perDay) + ' / 日';
    weeklyValueEl.textContent = formatYen(perDay * weekDaysLeft);
  }

  // 店別・カテゴリ別 集計
  renderBreakdown('storeBreakdown', monthEntries, e => e.store || '(店名未入力)');
  renderBreakdown('categoryBreakdown', monthEntries, e => e.category || '(未分類)');

  // list
  const listEl = document.getElementById('entryList');
  if (monthEntries.length === 0) {
    listEl.innerHTML = '<div class="empty">まだ記録がありません</div>';
  } else {
    listEl.innerHTML = '';
    monthEntries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'entry';
      const md = e.date.slice(5).replace('-', '/');
      row.innerHTML = `
        <div class="entry-info">
          <div class="entry-date">${md}</div>
          <div class="entry-store">${escapeHtml(e.store || '(店名未入力)')}</div>
          <div class="entry-cat">${escapeHtml(e.category || '未分類')}</div>
        </div>
        <div class="entry-amount">${formatYen(e.amount)}</div>
        <button class="del-btn" data-id="${e.id}">✕</button>
      `;
      listEl.appendChild(row);
    });
    listEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = Number(btn.getAttribute('data-id'));
        entries = entries.filter(e => e.id !== id);
        await saveEntries();
        render();
      });
    });
  }
}

function renderBreakdown(containerId, monthEntries, keyFn) {
  const container = document.getElementById(containerId);
  if (monthEntries.length === 0) {
    container.innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }
  const totals = {};
  monthEntries.forEach(e => {
    const key = keyFn(e);
    totals[key] = (totals[key] || 0) + e.amount;
  });
  const sorted = Object.entries(totals).sort((a,b) => b[1]-a[1]);
  const max = sorted[0][1] || 1;
  container.innerHTML = '';
  sorted.forEach(([name, amount]) => {
    const row = document.createElement('div');
    row.className = 'breakdown-row';
    const barPct = Math.round((amount / max) * 100);
    row.innerHTML = `
      <div class="breakdown-name">${escapeHtml(name)}</div>
      <div class="breakdown-bar-bg"><div class="breakdown-bar-fill" style="width:${barPct}%"></div></div>
      <div class="breakdown-amount">${formatYen(amount)}</div>
    `;
    container.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function addEntry() {
  const dateInput = document.getElementById('dateInput');
  const storeInput = document.getElementById('storeInput');
  const storeOtherInput = document.getElementById('storeOtherInput');
  const categoryInput = document.getElementById('categoryInput');
  const amountInput = document.getElementById('amountInput');
  const statusMsg = document.getElementById('statusMsg');

  const date = dateInput.value || todayStr();
  let store = storeInput.value;
  if (store === 'その他') {
    store = storeOtherInput.value.trim() || 'その他';
  }
  const category = categoryInput.value;
  const amount = parseFloat(amountInput.value);

  if (!amount || amount <= 0) {
    statusMsg.style.color = 'var(--red)';
    statusMsg.textContent = '金額を正しく入力してください。';
    return;
  }

  entries.push({
    id: Date.now(),
    date,
    store,
    category,
    amount
  });

  await saveEntries();
  render();

  storeOtherInput.value = '';
  amountInput.value = '';
  statusMsg.style.color = 'var(--sub)';
  statusMsg.textContent = '追加しました。';
  setTimeout(() => { statusMsg.textContent = ''; }, 1500);
}

document.getElementById('addBtn').addEventListener('click', addEntry);
document.getElementById('dateInput').value = todayStr();

document.getElementById('storeInput').addEventListener('change', () => {
  const isOther = document.getElementById('storeInput').value === 'その他';
  document.getElementById('storeOtherInput').style.display = isOther ? 'block' : 'none';
});

document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.toggle('open');
});
document.getElementById('closeSettingsBtn').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.remove('open');
});
document.getElementById('saveBudgetBtn').addEventListener('click', async () => {
  const val = parseFloat(document.getElementById('budgetInput').value);
  if (!val || val <= 0) return;
  budget = val;
  await saveSettings();
  render();
  document.getElementById('settingsPanel').classList.remove('open');
});

(async () => {
  await loadSettings();
  await loadEntries();
  render();
})();
</script>

</body>
</html>
